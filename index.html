<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#080c12">
<title>Mengen Aşçılık | Gastronomi Akademisi Pro</title>
<style>
:root{--bg:#080c12;--surf:#131b29;--surf2:#1b263b;--bdr:rgba(255,255,255,.12);--gold:#d97706;--gold2:#f59e0b;--grn:#10b981;--red:#ef4444;--blu:#38bdf8;--txt:#f8fafc;--mut:#94a3b8}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;user-select:none;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;touch-action:manipulation}
html,body{background:radial-gradient(ellipse at 50% -10%,#2a1c0a 0,transparent 55%) fixed,var(--bg);color:var(--txt);min-height:100%;width:100%;overflow-x:hidden}
#app{width:100%;max-width:480px;margin:0 auto;min-height:100dvh;display:flex;flex-direction:column;padding:max(12px,env(safe-area-inset-top)) 14px max(36px,env(safe-area-inset-bottom))}
@keyframes fadeUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes shake{0%,100%{transform:none}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(245,158,11,.35)}50%{box-shadow:0 0 18px 2px rgba(245,158,11,.55)}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
button:focus-visible{outline:2px solid var(--blu);outline-offset:2px}
.hdr{background:var(--surf);border:1px solid var(--bdr);border-radius:14px;padding:11px 14px;margin-bottom:12px;display:flex;flex-direction:column;gap:8px;position:sticky;top:6px;z-index:20;box-shadow:0 8px 20px rgba(0,0,0,.5)}
.h-top{display:flex;justify-content:space-between;align-items:center}
.prof{display:flex;align-items:center;gap:10px}
.emb{width:36px;height:36px;border-radius:10px;background:linear-gradient(135deg,rgba(245,158,11,.25),rgba(217,119,6,.05));border:1px solid var(--gold2);display:flex;align-items:center;justify-content:center;font-weight:900;color:var(--gold2);font-size:14px}
.rmeta h2{font-size:12.5px;letter-spacing:.3px}.rmeta p{font-size:11px;color:var(--gold2);font-weight:700}
.hud-r{display:flex;align-items:center;gap:8px}
.pill{background:#080c12;border:1px solid var(--bdr);padding:5px 10px;border-radius:8px;font-size:11.5px;font-weight:800;color:var(--gold2)}
button.pill{cursor:pointer}
.dots{display:flex;gap:5px}.dot{width:10px;height:10px;border-radius:50%;background:var(--gold2);box-shadow:0 0 6px var(--gold2);transition:.25s}.dot.lost{background:#293548;box-shadow:none;transform:scale(.75)}
.xptrk{width:100%;height:5px;background:#080c12;border-radius:9px;overflow:hidden}.xpfil{height:100%;background:linear-gradient(90deg,var(--gold),#fde047);width:5%;transition:width .4s ease}
.scr{display:none;flex-direction:column;flex:1;gap:10px}.scr.active{display:flex;animation:fadeUp .22s ease-out}
.hero{background:linear-gradient(135deg,#251b0e 0%,var(--surf) 100%);border:1px solid rgba(245,158,11,.45);border-radius:16px;padding:15px}
.htag{font-size:10px;font-weight:800;letter-spacing:.6px;color:var(--gold2);margin-bottom:4px;display:flex;justify-content:space-between;align-items:center;gap:6px}
.hero h1{font-size:18.5px;font-weight:800;margin-bottom:4px}.hero p{font-size:11.5px;color:var(--mut);line-height:1.4}
.sstrip{display:grid;grid-template-columns:repeat(5,1fr);gap:4px;margin-top:12px;padding-top:10px;border-top:1px solid var(--bdr);text-align:center}
.sstrip small{display:block;font-size:9px;color:var(--mut);margin-bottom:2px}.sstrip b{font-size:12.5px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:9px;padding-bottom:12px}
.scard{background:var(--surf);border:1px solid var(--bdr);border-radius:13px;padding:12px;color:var(--txt);text-align:left;cursor:pointer;display:flex;flex-direction:column;justify-content:space-between;transition:transform .12s;appearance:none;-webkit-appearance:none}
.scard:active{transform:scale(.97)}.scard.full{grid-column:span 2;background:linear-gradient(90deg,#2c1f0f,var(--surf2));border-color:var(--gold2)}
.scard.err{grid-column:span 2;background:linear-gradient(90deg,rgba(239,68,68,.18),var(--surf));border-color:rgba(239,68,68,.55)}
.scard.spec{border-color:rgba(16,185,129,.45);background:linear-gradient(135deg,rgba(16,185,129,.1),var(--surf))}
.stop{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;width:100%}
.scode{font-size:9px;font-weight:800;color:var(--gold2);background:rgba(245,158,11,.15);padding:2px 6px;border-radius:4px}
.scard.spec .scode{color:#34d399;background:rgba(16,185,129,.18)}.scard.err .scode{color:#fca5a5;background:rgba(239,68,68,.22)}
.mast{font-size:10px;font-weight:700;color:var(--mut)}
.scard h3{font-size:13px;font-weight:700;margin-bottom:3px}.scard p{font-size:10.5px;color:var(--mut);line-height:1.3}
.rst{background:none;border:none;color:var(--mut);font-size:10.5px;text-decoration:underline;padding:8px;cursor:pointer;align-self:center}
.gnav{display:flex;justify-content:space-between;align-items:center;font-size:12px}
.abtn{background:var(--surf);border:1px solid var(--bdr);color:var(--mut);border-radius:8px;padding:6px 11px;font-size:11px;font-weight:700;cursor:pointer}
.spk{background:rgba(245,158,11,.15);border:1px solid var(--gold2);color:var(--gold2);padding:4px 9px;border-radius:7px;font-weight:800;font-size:11px}
.spk.hot{background:rgba(239,68,68,.22);border-color:#f87171;color:#fecaca;animation:pulse 1.5s infinite}
.ttrk{width:100%;height:6px;background:#1e293b;border-radius:9px;overflow:hidden}.tfil{height:100%;width:100%;background:linear-gradient(90deg,var(--grn),var(--gold2))}.tfil.low{background:linear-gradient(90deg,var(--red),#fb923c)}
.qbox{background:var(--surf);border:1px solid var(--bdr);border-radius:15px;padding:15px;min-height:110px;display:flex;flex-direction:column;justify-content:center}
.qbox.hot{border-color:var(--gold2);animation:pulse 2s infinite}
.qbox.blitz{border-color:var(--blu);background:linear-gradient(135deg,rgba(56,189,248,.12),var(--surf))}
.qhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;gap:8px}
.qtag{font-size:10px;font-weight:800;color:var(--gold2);letter-spacing:.4px}.qbox.blitz .qtag{color:var(--blu)}
.qnum{font-size:10px;color:var(--mut);font-weight:700;white-space:nowrap}
.qtxt{font-size:14.5px;font-weight:600;line-height:1.5}
.opts{display:flex;flex-direction:column;gap:8px;margin:4px 0}.opts.tf-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.obtn{background:var(--surf);border:1.5px solid var(--bdr);border-radius:12px;padding:12px;color:var(--txt);font-size:12.5px;font-weight:500;text-align:left;display:flex;align-items:center;gap:10px;cursor:pointer;transition:transform .1s,background .15s;animation:fadeUp .25s both}
.opts.tf-grid .obtn{flex-direction:column;justify-content:center;text-align:center;padding:20px 10px;font-size:14px;font-weight:800}
.obtn:active{transform:scale(.98)}
.okey{width:25px;height:25px;border-radius:7px;background:#080c12;border:1px solid var(--bdr);display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:800;color:var(--gold2);flex-shrink:0}
.obtn.ok{background:rgba(16,185,129,.2);border-color:var(--grn);color:#d1fae5}.obtn.ok .okey{background:var(--grn);color:#000;border-color:var(--grn)}
.obtn.no{background:rgba(239,68,68,.2);border-color:var(--red);color:#fee2e2;animation:shake .35s}.obtn.no .okey{background:var(--red);color:#fff;border-color:var(--red)}
.obtn.elim{opacity:.2;pointer-events:none}.obtn.glow{border-color:var(--gold2);box-shadow:0 0 14px rgba(245,158,11,.45)}
.exp{background:#0f172a;border:1px solid var(--gold2);border-radius:12px;padding:11px 12px;font-size:11.5px;line-height:1.4;display:none;align-items:center;justify-content:space-between;gap:10px}.exp.show{display:flex;animation:fadeUp .2s}
.nbtn{background:var(--gold2);color:#000;border:none;border-radius:8px;padding:10px 14px;font-weight:900;font-size:11.5px;flex-shrink:0;cursor:pointer}
.jrow{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:auto;padding-top:6px}
.jbtn{background:var(--surf);border:1px solid var(--bdr);border-radius:10px;padding:8px 3px;color:var(--txt);font-size:10.5px;font-weight:700;display:flex;flex-direction:column;align-items:center;gap:2px;cursor:pointer}.jbtn:disabled{opacity:.28;pointer-events:none}.jbtn small{font-size:9px;color:var(--gold2)}
.rgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:12px 0}
.rbox{background:#080c12;border:1px solid var(--bdr);border-radius:10px;padding:10px}.rbox small{font-size:10px;color:var(--mut);display:block}.rbox b{font-size:16px;color:var(--gold2)}
.err-list{background:#080c12;border:1px solid var(--bdr);border-radius:10px;padding:10px;text-align:left;font-size:11px;color:var(--mut);max-height:150px;overflow-y:auto;margin-bottom:10px;line-height:1.45}
.mbtn{background:linear-gradient(90deg,var(--gold),var(--gold2));color:#000;border:none;border-radius:12px;padding:14px;font-size:13.5px;font-weight:800;width:100%;cursor:pointer;margin-top:8px}
.mbtn.alt{background:var(--surf2);color:var(--txt);border:1px solid var(--bdr)}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#1e293b;border:1px solid var(--gold2);color:var(--txt);padding:10px 16px;border-radius:10px;font-size:12px;font-weight:700;z-index:99;display:none;box-shadow:0 8px 25px rgba(0,0,0,.6);text-align:center;width:90%;max-width:400px}

.hero2{display:flex;gap:14px;align-items:center;background:linear-gradient(135deg,#2a1c0a,var(--surf));border:1px solid rgba(245,158,11,.4);border-radius:18px;padding:16px}
.medal{position:relative;width:84px;height:84px;flex-shrink:0}
.medal svg{width:100%;height:100%;transform:rotate(-90deg)}
.rg,.rf{fill:none;stroke-width:7}.rg{stroke:rgba(255,255,255,.08)}
.rf{stroke:var(--gold2);stroke-linecap:round;stroke-dasharray:100;stroke-dashoffset:100;transition:stroke-dashoffset .8s ease}
.medal span{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font:700 26px Georgia,"Times New Roman",serif;color:var(--gold2)}
.hinfo{min-width:0}.hinfo h1{font:700 21px/1.15 Georgia,"Times New Roman",serif;margin:2px 0}
.hinfo p{font-size:11.5px;color:var(--mut);line-height:1.35}
.hstat{display:flex;gap:12px;font-size:11.5px;margin-top:8px;flex-wrap:wrap}.hstat b{color:var(--gold2)}
.cta{width:100%;display:flex;justify-content:space-between;align-items:center;background:linear-gradient(90deg,var(--gold),var(--gold2));color:#1a1000;border:none;border-radius:16px;padding:16px 18px;cursor:pointer;animation:pulse 2.4s infinite;text-align:left}
.cta b{display:block;font:700 19px Georgia,"Times New Roman",serif}.cta small{font-size:11px;font-weight:600;opacity:.75}
.go{width:38px;height:38px;border-radius:50%;background:#1a1000;color:var(--gold2);display:flex;align-items:center;justify-content:center;font-size:14px;flex-shrink:0}
.chips{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.chip{background:var(--surf);border:1px solid var(--bdr);color:var(--txt);border-radius:12px;padding:12px 11px;font-size:11.5px;font-weight:700;cursor:pointer;text-align:left;display:flex;justify-content:space-between;align-items:center;gap:6px;line-height:1.3}
.chip.err{border-color:rgba(239,68,68,.5);background:rgba(239,68,68,.1)}.chip.err b{background:var(--red);border-radius:9px;padding:1px 8px;font-size:11px}
.chip.rec{border-color:rgba(16,185,129,.45);background:rgba(16,185,129,.08)}
.sec{font:italic 700 15px Georgia,"Times New Roman",serif;color:var(--gold2);margin:10px 2px 0;display:flex;align-items:center;gap:10px}.sec::after{content:"";flex:1;height:1px;background:var(--bdr)}
.list{display:flex;flex-direction:column;background:var(--surf);border:1px solid var(--bdr);border-radius:16px;overflow:hidden}
.row{display:flex;gap:12px;align-items:center;background:none;border:none;border-bottom:1px solid var(--bdr);color:var(--txt);padding:12px 14px;text-align:left;cursor:pointer;width:100%}
.row:last-child{border-bottom:none}.row:active{background:rgba(245,158,11,.08)}
.ico{font-size:21px;width:42px;height:42px;border-radius:12px;background:#080c12;border:1px solid var(--ac,var(--bdr));display:flex;align-items:center;justify-content:center;flex-shrink:0}
.rbody{flex:1;min-width:0;display:flex;flex-direction:column;gap:4px}
.rline{display:flex;align-items:baseline}.rline b{font-size:13.5px;font-weight:700}
.dl{flex:1;border-bottom:2px dotted rgba(255,255,255,.2);margin:0 6px;min-width:10px}
.rline em{font-style:normal;font-size:11.5px;font-weight:800;color:var(--ac,var(--gold2))}
.rbody small{font-size:10.5px;color:var(--mut);line-height:1.3}
.rbar{height:3px;background:#080c12;border-radius:9px;overflow:hidden}.rbar u{display:block;height:100%;width:0;background:var(--ac,var(--gold2));transition:width .5s}
.pool{text-align:center;font-size:10px;color:var(--mut);margin-top:6px}
.daily{display:flex;align-items:center;gap:12px;width:100%;background:linear-gradient(90deg,rgba(56,189,248,.16),var(--surf));border:1px solid rgba(56,189,248,.5);border-radius:16px;padding:12px 14px;color:var(--txt);cursor:pointer;text-align:left}
.daily.done{opacity:.55;border-color:var(--bdr)}
.dic{font-size:22px;width:42px;height:42px;border-radius:12px;background:#080c12;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.dtx{flex:1;display:flex;flex-direction:column;gap:2px}.dtx b{font:700 15px Georgia,"Times New Roman",serif}.dtx small{font-size:10.5px;color:var(--mut)}
.dgo{color:var(--blu);font-size:13px;font-weight:800}
.bdg{display:grid;grid-template-columns:repeat(6,1fr);gap:6px}
.b{display:flex;flex-direction:column;align-items:center;gap:3px;filter:grayscale(1);opacity:.35}.b.on{filter:none;opacity:1}
.b span{width:44px;height:44px;border-radius:50%;background:var(--surf);border:1px solid var(--bdr);display:flex;align-items:center;justify-content:center;font-size:20px}
.b.on span{border-color:var(--gold2);box-shadow:0 0 10px rgba(245,158,11,.35)}
.b small{font-size:8.5px;color:var(--mut);text-align:center;line-height:1.2}
.sheet{position:fixed;inset:0;background:rgba(0,0,0,.6);display:none;align-items:flex-end;justify-content:center;z-index:60}.sheet.open{display:flex}
.sbox{width:100%;max-width:480px;background:var(--surf);border-radius:20px 20px 0 0;border:1px solid var(--bdr);padding:14px 16px max(18px,env(safe-area-inset-bottom));animation:fadeUp .2s}
.sgrab{width:40px;height:4px;border-radius:9px;background:var(--bdr);margin:0 auto 10px}
.sbox h3{font:700 19px Georgia,"Times New Roman",serif}.sbox p{font-size:11.5px;color:var(--mut);margin:3px 0 8px;line-height:1.4}
.mbtn small{font-weight:600;opacity:.7;font-size:10.5px;margin-left:6px}
.fcard{background:linear-gradient(135deg,#2a1c0a,var(--surf));border:1px solid rgba(245,158,11,.45);border-radius:18px;min-height:280px;padding:22px 18px;color:var(--txt);display:flex;flex-direction:column;justify-content:center;align-items:center;gap:14px;text-align:center;cursor:pointer;width:100%}
.fcard small{color:var(--gold2);font-size:10.5px;font-weight:800}
#fTxt{display:block;font:700 22px/1.3 Georgia,"Times New Roman",serif}.fcard.back #fTxt{font:600 16px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
#fNote{display:block;font-size:12px;color:var(--mut);line-height:1.45}.fhint{font-size:10.5px;color:var(--gold2);margin-top:auto}
.frow{display:grid;grid-template-columns:1fr 1fr;gap:8px}.frow .mbtn{margin-top:0}
</style>
</head>
<body>
<div id="app">
  <header class="hdr">
    <div class="h-top">
      <div class="prof"><div class="emb" id="rBdg">I</div><div class="rmeta"><h2 id="rNam">Stajyer Çırak</h2><p id="xpTxt">0 / 120 XP</p></div></div>
      <div class="hud-r"><button type="button" class="pill" id="sndBtn" aria-label="Ses" onclick="st.snd=!st.snd;hud()">🔊</button><div class="pill">🪙 <span id="gVal">100</span></div><div class="dots" id="lBox"></div></div>
    </div>
    <div class="xptrk"><div class="xpfil" id="xpBar"></div></div>
  </header>

  <section class="scr active" id="menuScr">
    <div class="hero2">
      <div class="medal"><svg viewBox="0 0 100 100"><circle class="rg" cx="50" cy="50" r="44"/><circle class="rf" id="ring" cx="50" cy="50" r="44" pathLength="100"/></svg><span id="rShort">I</span></div>
      <div class="hinfo">
        <p>Hoş geldin Şef</p>
        <h1 id="hRank">Stajyer Çırak</h1>
        <p id="hXp"></p>
        <div class="hstat"><span>🔥 <b id="streak">0 gün</b></span><span>🏆 <b id="bVal">0</b></span><span>✓ <b id="sVal">0</b></span></div>
      </div>
    </div>
    <button type="button" class="daily" id="dailyBtn" data-c="daily"><span class="dic">📋</span><span class="dtx"><b>Günün Siparişi</b><small id="dailyTxt">7 soru • +60 kredi • günde bir kez</small></span><span class="dgo">▶</span></button>
    <button type="button" class="cta" data-c="all"><span><b>Vardiyaya Başla</b><small>30 soruluk karma sınav • 3 can</small></span><span class="go">▶</span></button>
    <div class="chips">
      <button type="button" class="chip err" data-c="wrong"><span>⚠️ Hatalı Tabaklar</span><b id="wCount">0</b></button>
      <button type="button" class="chip rec" id="recBtn" data-c="servis"><span>⭐ <span id="recTxt"></span></span></button>
    </div>
    <h3 class="sec">Rozetler</h3><div class="bdg" id="bdg"></div>
    <h3 class="sec">Uzmanlık Menüsü</h3><div class="list" id="lstA"></div>
    <h3 class="sec">Klasik Bölümler</h3><div class="list" id="lstB"></div>
    <p class="pool" id="poolBadge">HAVUZ: YÜKLENİYOR...</p>
    <button type="button" class="rst" onclick="resetAll()">Tüm ilerlemeyi sıfırla</button>
  </section>

  <section class="scr" id="gameScr">
    <div class="gnav">
      <button type="button" class="abtn" onclick="abort()">✕ Menüye Dön</button>
      <span class="spk" id="strTxt">Seri: x1</span>
      <b id="scrTxt">0 Puan</b>
    </div>
    <div class="ttrk"><div class="tfil" id="tBar"></div></div>
    <div class="qbox" id="qCard">
      <div class="qhead"><span class="qtag" id="qTag"></span><span class="qnum" id="qNum"></span></div>
      <div class="qtxt" id="qTxt"></div>
    </div>
    <div class="opts" id="optWrap"></div>
    <div class="exp" id="expBar"><div id="expTxt"></div><button type="button" class="nbtn" id="nxtBtn">SIRADAKİ ▶</button></div>
    <div class="jrow">
      <button type="button" class="jbtn" id="j50" onclick="u50()"><span>🔪 %50 Ele</span><small>15 Kredi</small></button>
      <button type="button" class="jbtn" id="jTm" onclick="uTm()"><span>⏱️ +12 Sn</span><small>10 Kredi</small></button>
      <button type="button" class="jbtn" id="jSk" onclick="uSk()"><span>🔄 Sona At</span><small>15 Kredi</small></button>
      <button type="button" class="jbtn" id="jHn" onclick="uHn()"><span>👨‍🍳 İpucu</span><small>25 Kredi</small></button>
    </div>
  </section>

  <section class="scr" id="studyScr">
    <div class="gnav"><button type="button" class="abtn" onclick="show('menuScr')">✕ Kapat</button><b id="stCnt"></b></div>
    <div class="ttrk"><div class="tfil" id="stBar"></div></div>
    <button type="button" class="fcard" id="fCard" onclick="flip()"><small id="fTag"></small><span id="fTxt"></span><span id="fNote"></span><span class="fhint" id="fHint"></span></button>
    <div class="frow"><button type="button" class="mbtn alt" onclick="fNext(0)">↻ Tekrar göster</button><button type="button" class="mbtn" onclick="fNext(1)">✓ Biliyorum</button></div>
  </section>

  <section class="scr" id="overScr">
    <div class="hero" style="margin:auto 0;text-align:center;padding:18px">
      <div class="htag" style="justify-content:center">VARDİYA DEĞERLENDİRME KARNESİ</div>
      <h2 id="fGrade"></h2>
      <div style="font-size:36px;font-weight:900;color:var(--gold2);margin:6px 0" id="fScr">0 Puan</div>
      <div class="rgrid">
        <div class="rbox"><small>Doğru Tabak</small><b id="fOk">0</b></div>
        <div class="rbox"><small>Başarı Oranı</small><b id="fAcc">%0</b></div>
      </div>
      <div class="err-list" id="errSummary"></div>

const EMBED={"db":[["servis","Mise en Place (Ön Hazırlık)","açılıştan kapanışa kadar süren genel düzen, temizlik ve ön hazırlık çalışmaları","Fransızca 'her şey yerli yerinde' demektir; servis akışının aksamaması için yapılır.","a"],["servis","Kuver (Couvert / Set-up)","müşterilerin yemek için ihtiyaç duyduğu malzemelerin düzenli biçimde masaya yerleştirilmesi işlemi","Avrupa'da kuver açmak, Amerikan literatüründe set-up olarak geçer.","a"],["servis","Molton","masa örtüsünün altına serilip kaymayı, tabak sesini ve sıvının geçmesini engelleyen kalın koruyucu kumaş","Kuver açılırken masaya ilk serilen tekstildir.","a"],["servis","Menaj Takımı","masada konukların kullanımına sunulan tuzluk, biberlik, yağlık ve sirkelik gibi tamamlayıcı ekipman","Tuzluk ve vazo üzerindeki amblemler kapı girişine bakar.","a"],["servis","ÇKB Dizilim Kuralı","çatal, kaşık ve bıçakların masaya içeriden dışarıya dizilip dışarıdan içeriye doğru kullanılması düzeni","İlk yenecek yemeğin takımı en dışta, ana yemek takımı tabağa en yakındır.","b"],["servis","Tatlı ÇKB Konumu","tatlı çatal, kaşık ve bıçaklarının kuver tabağının üst tarafına, masa kenarına paralel yerleştirilmesi","Tatlı servisinden önce masada hazır bulunurlar.","b"],["servis","Kuver 2 cm Kuralı","kuver tabağının masa kenarına, ÇKB'nin tabağa ve ÇKB'lerin kendi aralarına uzaklığının 2 cm olması standardı","ÇKB sapları kuver tabağının alt hizasında ve masa kenarına dik durur.","b"],["servis","Logo ve Amblem Yönü","tabak üzerindeki logonun konuğun karşısına, vazo ve tuzluk amblemlerinin kapı girişine bakması kuralı","Kurumsal görsel standartların korunmasını sağlar.","b"],["servis","Su Bardağı Konumu","su (üniversal) bardağının ana yemek bıçağının ucunun 2-3 cm karşısına yerleştirilmesi","İçecek bardakları kuverde sağ üst köşeye konur.","b"],["servis","Kuver Maksimum Takım Sınırı","kuver tabağının sağında en fazla 4 takım ve 4 bardak, solunda ve yukarısında en fazla 3'er takım bulunması kuralı","Masada kalabalığı önleyen uluslararası kuver standardıdır.","b"],["servis","Basit Kuver","içki servisi olmayan, tencere yemeği ve ızgara sunan 1-2 yıldızlı işletmelerde kullanılan sade kuver","Çorba kaşığı, ana yemek çatal-bıçağı ve su bardağı yer alır.","d"],["servis","Geliştirilmiş Kuver","basit kuvere ordövr çatal-bıçağı ve şarap bardaklarının eklendiği alakart restoran kuveri","Soğuk ordövr ile başlandığı için orta boy takım en dışa konur.","d"],["servis","Ziyafet (Banket) Kuveri","düğün, balo ve seminer gibi etkinliklerde menüye göre önceden hazırlanan kuver","Menü önceden bilindiği için malzemeler baştan masaya yerleştirilir.","d"],["servis","Alakart (A'la Carte) Servis","menüdeki yemeklerin kartta yazan fiyatlardan, sipariş üzerine hazırlanıp sunulması usulü","Fransızca 'karta göre' anlamına gelir.","d"],["servis","Table d'hôte","sabit fiyatlı ve önceden belirlenmiş yemek sırasından oluşan menü türü","A'la carte'ın aksine konuğun seçenekleri sınırlıdır.","d"],["servis","Amerikan Servisi","yemeklerin mutfakta tabaklara porsiyonlanıp konuğun önüne hazır getirildiği hızlı servis türü","Yoğun salonlarda ve banketlerde hız sağlar.","d"],["servis","Rus Servisi","yemeğin servis tabağıyla masaya getirilip garsonun konuğun tabağına sunduğu servis türü","Gösterişlidir ancak daha fazla servis personeli gerektirir.","d"],["servis","Fransız Servisi (Gueridon)","yemeğin masa yanındaki servis arabasında konuğun önünde hazırlanıp sunulduğu gösterişli servis türü","Flambe gibi masa başı sunumlar bu servise örnektir.","d"],["servis","Maître d'hôtel","servis salonunun genel yönetiminden ve konuk karşılamadan sorumlu restoran müdürü","Salon ekibinin en üst düzey yöneticisidir.","e"],["servis","Sommelier","şarap seçimi, yemekle eşleştirilmesi ve servisinden sorumlu uzman servis personeli","Konuğa yemekle uyumlu şarap önerir.","e"],["servis","Sorbe (Intermezzo)","yemek aralarında damağı temizlemek için sunulan buzlu, hafif ve az şekerli ürün","Klasik menüde ağır yemekler arasında verilir.","a"],["servis","Brigade de Cuisine","mutfak personelini görev ve rütbeye göre ayıran, Escoffier'e atfedilen hiyerarşik düzen","Modern profesyonel mutfak organizasyonunun temelidir.","e"],["servis","Aboyeur (Pass)","siparişleri mutfağa ileten ve tabakların servise çıkışını koordine eden sorumlu","Günümüzde expeditor olarak da anılır.","e"],["servis","Standart Reçete (Tarife)","kalite, porsiyon tutarlılığı ve maliyet kontrolü sağlayan doğrulanmış yemek üretim formülü","Kim pişirirse pişirsin aynı lezzet ve porsiyonu hedefler.","a"],["servis","Servis Yönü Kuralı","yemeklerin konuğun solundan sunulup kullanılmış tabakların sağdan toplanması genel kuralı","İçecekler genellikle sağdan servis edilir.","b"],["servis","Chef de Rang","belirli masaların servisinden sorumlu istasyon şefi garson","Commis de rang'a görev verir ve konukla doğrudan ilgilenir.","e"],["servis","Commis de Rang","chef de rang'ın yanında çalışan, servis desteği veren komi garson","Masa toplama ve malzeme taşıma gibi işleri üstlenir.","e"],["servis","Büfe Servisi","yemeklerin servis hattında sergilenip konukların kendi tabaklarına kendilerinin aldığı servis türü","Kalabalık gruplarda hız ve çeşitlilik sağlar.","d"],["servis","Debarras (Masa Toplama)","konuğun yemeği bittikten sonra kirli tabak ve ekipmanın masadan toplanması işlemi","Toplama genellikle konuğun sağından yapılır.","b"],["pasta","Pâte à Choux (Şu Hamuru)","su, tereyağı, un ve yumurtayla önce ocakta kavrulup sonra fırınlanan profiterol ve ekler hamuru","Maya içermez; su buharı basıncıyla içi boşalarak kabarır.","h"],["pasta","İtalyan Merengi","118°C-121°C'ye kadar pişen şeker şurubunun çırpılan yumurta akına ince ince akıtılmasıyla yapılan mereng","En stabil ve güvenli mereng türüdür; ısı yumurta akını pişirir.","k"],["pasta","İsviçre Merengi","yumurta akı ve şekerin benmaride şeker eriyene kadar ısıtılıp sonra çırpılmasıyla yapılan mereng","Yoğun, parlak ve dayanıklı yapılıdır.","k"],["pasta","Crème Anglaise","süt, krema, şeker ve yumurta sarısının 82°C-84°C'ye kadar pişirildiği akışkan temel krema","Dondurma ve Bavarois tabanıdır.","k"],["pasta","Crème Pâtissière","süt, yumurta sarısı, şeker ve nişastayla kaynatılarak koyulaştırılan pasta kreması","Ekler, profiterol ve tart dolgularının klasik kremasıdır.","k"],["pasta","Çikolata Temperleme","kakao yağındaki kararlı (Beta) kristalleri oluşturup parlaklık ve kırılganlık veren ısıtma-soğutma işlemi","Bitterde çalışma sıcaklığı 31°C-32°C'dir; temperlenmeyen çikolatada yağ çiçeklenmesi oluşur.","t"],["pasta","Ganaj","çikolatanın sıcak kremayla emülsiyon haline getirilmesiyle elde edilen krema","Çikolata oranı arttıkça daha sert kıvam alır; trüf için idealdir.","k"],["pasta","Pâte Sablée","yüksek tereyağı oranıyla kumlu ve gevrek yapı kazanan tatlı tart hamuru","Adı 'kum' anlamına gelen sable sözcüğünden gelir.","h"],["pasta","Pâte Brisée","şekersiz veya çok az şekerli, tuzlu tart ve kişlerde kullanılan kıtır hamur","Glüten gelişmesin diye az yoğrulur ve soğuk kullanılır.","h"],["pasta","Milföy (Pâte Feuilletée)","hamur ve yağın tekrarlı katlanıp açılmasıyla yüzlerce ince katman oluşturulan laminasyon hamuru","Klasik yöntemde 6 basit katlamayla 729 kat elde edilir.","h"],["pasta","Kruvasan Hamuru","mayalı olup yağ katlama (laminasyon) ile katmanlandırılan tereyağlı hamur","Milföyden farklı olarak mayayla da kabarır.","h"],["pasta","Otoliz (Autolyse)","un ve suyun maya ve tuz eklenmeden karıştırılıp dinlendirilmesi","Gluten gelişimini kolaylaştırır, yoğurma süresini kısaltır.","t"],["pasta","Poolish","eşit ağırlıkta un ve suyun az maya ile karıştırılıp önceden mayalandırılmasıyla hazırlanan ön hamur","%100 hidratasyonludur; ekmeğe aroma ve doku katar.","t"],["pasta","Bavarois","crème anglaise'in jelatin ve çırpılmış kremayla kıvamlandırılıp kalıpta soğutulduğu tatlı","Soğuk servis edilir; kıvamı jelatinden gelir.","p"],["pasta","Tarte Tatin","meyvenin karamel üzerinde pişirilip hamurla kapatılan ve ters çevrilerek sunulan tatlı","En bilinen örneği elmalıdır.","p"],["pasta","Chantilly Kreması","soğuk kremanın şeker ve vanilyayla çırpılmasıyla yapılan hafif krema","Kremanın ve çırpma kabının soğuk olması hacmi artırır.","k"],["pasta","Pralin","karamelize şekerle kavrulmuş fındık veya bademin ezilmesiyle elde edilen aromatik macun","Pasta ve çikolata dolgularında lezzet verici olarak kullanılır.","k"],["pasta","Éclair","şu hamurunun uzun biçimde pişirilip kremayla doldurulduktan sonra fondan veya çikolatayla kaplanması","Adı Fransızca 'şimşek' anlamına gelir.","p"],["pasta","Profiterol","küçük yuvarlak şu hamuru toplarının kremayla doldurulup çikolata sosuyla sunulduğu tatlı","Genellikle çikolata sosuyla servis edilir.","p"],["pasta","Mille-feuille (Napolyon)","milföy katmanları arasına pasta kreması konarak hazırlanan katmanlı pasta","Adı 'bin yaprak' anlamına gelir.","p"],["pasta","Proofing (Son Mayalanma)","şekillendirilmiş mayalı hamurun fırına girmeden önce son kez kabarmaya bırakılması","Sıcak ve nemli ortamda yapılır.","t"],["pasta","Macaron","badem unu, pudra şekeri ve merengle yapılan, iki kabuğu dolguyla birleştirilen küçük pasta","Kabuğun altındaki 'ayak' oluşumu kalite göstergesidir.","p"],["pasta","Soufflé","yumurta sarısı tabanına çırpılmış yumurta akı katılıp fırında kabarttırılan hafif yemek","Servise çıkmadan hemen önce pişirilmelidir; çabuk çöker.","p"],["pasta","Dacquoise","badem unu ve merengle hazırlanan hafif ve gevrek pasta tabanı","Pasta katmanlarında taban olarak kullanılır.","p"],["pasta","Fondan","şeker şurubunun pişirilip işlenmesiyle elde edilen, kaplamada kullanılan beyaz şeker kreması","Éclair ve pasta yüzeylerinde parlak kaplama sağlar.","k"],["pasta","Fermantasyon","mayanın şekeri alkole ve karbondioksite çevirerek hamuru kabarttığı süreç","Süre ve sıcaklık lezzeti ve dokuyu belirler.","t"],["pasta","Gluten","una su eklenip yoğrulunca oluşan, hamura esneklik ve yapı veren protein ağı","Ekmekte güçlü, kekte zayıf gluten istenir.","t"],["pasta","Kuru Karamel","şekerin su kullanılmadan eritilip kahverengi renk ve aroma kazanana kadar pişirilmesi","Fazla pişirilirse acılaşır.","t"],["maliyet","AP / EP Ağırlık","temizlemeden önce satın alınan ağırlık ile temizlemeden sonra kullanılabilir net ağırlık","AP: As Purchased (brüt); EP: Edible Portion (net).","a"],["maliyet","Fire","kabuk soyma, kemik ayırma ve temizleme sonucu oluşan ağırlık kaybı","Fire % = (Brüt − Net) / Brüt × 100.","a"],["maliyet","Verim (Yield %)","net kullanılabilir miktarın brüt miktara oranı","Verim = 100 − Fire %.","a"],["maliyet","Food Cost %","yiyecek maliyetinin vergisiz satış fiyatına oranı","Food Cost % = Maliyet / Satış Fiyatı × 100.","a"],["maliyet","Standart Porsiyon Maliyeti","standart reçetedeki tüm malzeme maliyetlerinin toplamının porsiyon sayısına bölünmesi","Fiyatlamanın temel girdisidir.","a"],["maliyet","Fırıncı Yüzdesi (Baker's %)","reçetedeki tüm malzemelerin un ağırlığına oranla yüzde olarak ifade edildiği sistem","Un daima %100'dür.","a"],["maliyet","Hidratasyon","hamurdaki su miktarının un miktarına yüzdesel oranı","Hidratasyon = Su / Un × 100.","a"],["maliyet","Reçete Çarpanı","istenen porsiyon sayısının mevcut reçetenin porsiyon sayısına bölünmesiyle bulunan katsayı","Tüm malzeme miktarları bu çarpanla çarpılır.","a"],["maliyet","Prime Cost","yiyecek maliyeti ile işçilik maliyetinin toplamı","İşletmelerde genellikle satışların %60-65'i civarında ve altı hedeflenir.","a"],["maliyet","Başabaş Noktası","toplam gelirin toplam maliyete eşit olduğu, ne kâr ne zarar edilen satış düzeyi","Bu noktanın üzerindeki satışlar kâr üretir.","a"],["maliyet","Menü Mühendisliği","menü kalemlerini popülerlik ve kâr katkısına göre sınıflandırıp menüyü iyileştirme yöntemi","Kasavana ve Smith'in Star, Plowhorse, Puzzle, Dog sınıflamasına dayanır.","b"],["maliyet","Star (Yıldız) Ürün","hem popülerliği hem kâr katkısı yüksek olan menü kalemi","Menüde öne çıkarılıp korunması gerekir.","b"],["maliyet","Plowhorse (İş Atı) Ürün","popülerliği yüksek fakat kâr katkısı düşük olan menü kalemi","Maliyet düşürülerek veya fiyat artırılarak iyileştirilir.","b"],["maliyet","Puzzle (Bilmece) Ürün","kâr katkısı yüksek fakat popülerliği düşük olan menü kalemi","Daha görünür yerleştirilerek veya tanıtılarak satışı artırılır.","b"],["maliyet","Çarpan Yöntemi","reçete maliyetinin hedef food cost oranına bölünmesinden elde edilen katsayıyla satış fiyatı belirleme","Food cost %30 ise maliyet yaklaşık 3,33 ile çarpılır.","a"],["maliyet","Stok Devir Hızı","dönem içinde stokun kaç kez tüketilip yenilendiğini gösteren oran","Yüksek devir, ürünlerin bozulmadan hızlı kullanıldığını gösterir.","a"],["maliyet","Değişken Maliyet","üretim ve satış miktarına göre değişen gıda ve ambalaj gibi maliyetler","Satış arttıkça toplam tutarı artar.","a"],["maliyet","Sabit Maliyet","satış miktarından bağımsız olarak sürekli ödenen kira ve amortisman gibi giderler","Başabaş analizinin temel bileşenidir.","a"],["maliyet","Brüt Kâr","satış gelirinden yiyecek maliyetinin çıkarılmasıyla bulunan tutar","Food cost düştükçe brüt kâr artar.","a"],["maliyet","Satılan Malın Maliyeti (COGS)","dönem başı stok ile alışların toplamından dönem sonu stokun çıkarılmasıyla bulunan maliyet","İşletmenin gerçek yiyecek maliyetini gösterir.","a"],["maliyet","Dog (Köpek) Ürün","hem popülerliği hem kâr katkısı düşük olan menü kalemi","Genellikle menüden çıkarılması değerlendirilir.","b"],["tarih","Yale Pişirme Tabletleri","yaklaşık MÖ 1700'lere ait, Mezopotamya mutfağından 35 tarif içeren üç çivi yazılı tablet","Bilinen en eski yemek tarifleri arasında sayılır.","e"],["tarih","Hitit Çivi Yazılı Metinleri","ızgara çeşitlerini ve 100'den fazla hamur işi adını kayda geçiren eski Anadolu yazıtları","Hitit mutfağına dair en önemli yazılı kaynaktır.","e"],["tarih","Kitâbü't-Tabîh (Şirvânî)","13. yüzyıl Bağdat yemek kitabının 15. yüzyılda Türkçeye çevrilip Osmanlı tarifleriyle genişletilmesi","Yaklaşık 80 tarif eklenmiştir; ilk Türkçe yemek kitabı sayılır.","e"],["tarih","Melceü't-Tabbâhîn (1844)","Mekteb-i Tıbbiye hocası Mehmed Kâmil'in yazdığı, 273 tarifli, basılan ilk Türkçe yemek kitabı","Anlamı 'Aşçıların Sığınağı'dır; 1888'e kadar 9 baskı yapmıştır.","e"],["tarih","Ev Kadını (1882)","Osmanlı'da hanımlara tarif, sofra adabı ve alafranga düzen öğreten, 876 tarifli yemek kitabı","Yazarı Ayşe Fahriye'dir; biftek gibi yeni girmiş yemekleri de içerir.","e"],["tarih","Matbah-ı Âmire","saray mutfaklarını, helvahaneyi, kileri ve fırınları barındıran idari saray mutfak teşkilatı","Tek bir mutfak değil, devlet hazinesinden beslenen geniş bir kurumdur.","b"],["tarih","Matbah-ı Has","saray halkının yemeklerinin pişirildiği mutfakların en önemlisi","Padişahın yemeği buradaki kuşhane bölümünde pişerdi.","b"],["tarih","Helvahane","saray mutfağına bağlı, helva, reçel ve turşu yapılan ve ilaç da hazırlanan birim","Saray eczanesi işlevi de görürdü.","b"],["tarih","Saray Aşçıbaşısı","has mutfağın usta kadrosunda yer alan ve ağa rütbesiyle mutfak personelinin amiri olan kişi","Mutfak hiyerarşisinin en üstündeki aşçıdır.","b"],["tarih","Matbah-ı Âmire Emini","saray mutfaklarının idaresinden sorumlu üst düzey görevli","Helvahane de onun yönetimine bağlıydı.","b"],["tarih","Helvacıbaşı","helvahane mutfağının başında bulunan amir","Çeşnigirbaşı ve hoşafçıbaşı ile birlikte helvahane amirlerindendir.","b"],["tarih","Kuşhane","padişahın yemeğinin pişirildiği has mutfaktaki özel bölüm","Padişah yemeği burada hazırlanırdı.","b"],["tarih","Yeni Yemek Kitabı (1880/81)","19. yüzyılın sonlarında İstanbul'da basılan eski harfli Türkçe yemek kitaplarından biri","Melceü't-Tabbâhîn'den sonra basılan eserlerdendir.","e"],["tarih","Aşçıbaşı (1900)","1900'de basılan, Osmanlı'nın son döneminin eski harfli yemek kitaplarından biri","Basılı yemek kitabı geleneğinin devamıdır.","e"],["mengen","Mengen Pilavı","kuzu eti, mantar, ceviz içi, domates ve dereotuyla tereyağında pişirilen Mengen pilavı","Ceviz ve dereotu karakteristik imzasıdır.","y"],["mengen","Mengen","aşçılığı ata mesleği sayılan, aşçıları saray mutfaklarına kadar uzanan Bolu ilçesi","Aşçılık geleneği babadan oğula yüzyıllardır sürer.","k"],["mengen","Uluslararası Mengen Aşçılık Festivali","Mengen'de ilk kez 1981'de düzenlenen ve her yıl eylülde yapılan aşçılık etkinliği","Türk mutfağını tanıtan en bilinen aşçılık buluşmasıdır.","k"],["mengen","Mengen Aşçılık Lisesi","1985'te açılan ve Türkiye'nin ilk aşçılık okulu olarak anılan meslek lisesi","Festivalin bir ürünü olarak kurulmuştur.","k"],["mengen","Keş (Kurut)","Bolu mutfağında erişte ve çorbalarda kullanılan, kurutulmuş süt ürünü","Anadolu'da çoğu yerde kurut adıyla bilinir.","y"],["mengen","Keşli Cevizli Erişte","haşlanmış eriştenin üzerine tereyağında kavrulmuş keş ve dövülmüş cevizin eklendiği Bolu yemeği","Erişte ev yapımı olursa dokusu daha iyi olur.","y"],["mengen","Mudurnu Saray Helvası","un, şeker ve tereyağının uzun süre kavrulmasıyla yapılan beyaz renkli Bolu helvası","Genellikle kahvenin yanında ikram edilir.","y"],["mengen","İmaret Çorbası","süt, pirinç ve un-yumurta terbiyesiyle yapılıp üzerine naneli pul biberli tereyağı gezdirilen çorba","Terbiye sıcak çorbayla tavlanarak eklenir.","y"],["mengen","Bolu","Mengen, Mudurnu ve Göynük gibi ilçeleriyle tanınan Karadeniz ili","Mengen'in bağlı olduğu ildir.","k"],["mengen","Mudurnu","saray helvası ve tarihi evleriyle bilinen Bolu ilçesi","Mudurnu saray helvası ile ünlüdür.","k"],["kesim","Brunoise","julienne şeritlerin küp doğranmasıyla elde edilen, yaklaşık 3 mm kenarlı küçük küp kesim","İnce brunoise yaklaşık 1,5-2 mm kenarlıdır.","k"],["kesim","Julienne","yaklaşık 3x3 mm kalınlığında ve 5 cm uzunluğunda kibrit çöpü biçiminde kesim","Patateste bu kesime allumette denir.","k"],["kesim","Batonnet","yaklaşık 6x6 mm kalınlığında ve 5-6 cm uzunluğunda çubuk kesim","Julienne'den daha kalındır; çiğ sebze tabaklarında kullanılır.","k"],["kesim","Macédoine","yaklaşık 5-6 mm kenarlı küçük küp kesim","Brunoise'dan büyük, parmentier'den küçüktür.","k"],["kesim","Parmentier","yaklaşık 13 mm kenarlı orta boy küp kesim","Adını Fransız eczacı Parmentier'den alır; patatesle özdeşleşmiştir.","k"],["kesim","Chiffonade","yapraklı sebze ve otların rulo yapılıp ince şeritler halinde dilimlenmesi","Fransızca 'küçük kurdele' anlamına gelir; fesleğen ve ıspanakta kullanılır.","k"],["kesim","Paysanne","sebzelerin yaklaşık 10x10 mm genişlikte ve 3 mm kalınlıkta ince, düz parçalar halinde kesilmesi","Çorba ve kısa pişen yemekler için uygundur.","k"],["kesim","Tourné","sebzenin yedi yüzlü, ortası şişkin ve yaklaşık 5 cm boyunda ruga topu biçiminde oyulması","En zor klasik Fransız kesimlerinden biridir.","k"],["kesim","Rondelle","silindirik sebzelerin düz, yuvarlak disk biçiminde dilimlenmesi","Havuç ve salatalıkta sık kullanılır.","k"],["kesim","Mirepoix","2 kısım soğan, 1 kısım havuç ve 1 kısım kereviz sapından oluşan temel aromatik sebze karışımı","Stok ve temel soslarda lezzet omurgasıdır.","k"],["kesim","Carré","yaklaşık 20 mm kenarlı büyük küp kesim","Parmentier'den büyük küp kesimdir.","k"],["kesim","Şef Bıçağı","20-25 cm bıçak boyuyla en çok kullanılan genel amaçlı mutfak bıçağı","Doğrama, dilimleme ve kıyma işlerinin ana bıçağıdır.","m"],["kesim","Soyma Bıçağı (Paring)","küçük, kısa ağızlı soyma ve ince işçilik bıçağı","Tourné gibi hassas kesimlerde tercih edilir.","m"],["kesim","Masat","bıçak ağzının eğilmiş kısmını doğrultan çelik çubuk","Ağzı hizalar; asıl bileme işlevi görmez.","m"],["kesim","Pençe Tutuşu (Claw Grip)","kesim sırasında parmak uçlarının içe kıvrılarak sebzeyi tutması güvenli yöntemi","Bıçağın gövdesi parmak eklemlerine yaslanarak kayar.","m"],["kesim","Kare Kesim (Square-off)","sebzenin düzgün kesimler için kenarlarının düzleştirilerek dikdörtgen forma getirilmesi","Fire verir ama eşit ölçü sağlar.","m"],["sos","Béchamel Sos","beyaz roux üzerine süt eklenip muskatla aromalandırılan temel beyaz anne sos","Mornay sosun ve gratenlerin temelidir.","s"],["sos","Velouté Sos","beyaz roux ile açık renkli stokun (dana, tavuk veya balık) birleştirilmesiyle yapılan anne sos","Allemande ve Suprême gibi türevlerin temelidir.","s"],["sos","Espagnole Sos","kahverengi roux, kahverengi stok, mirepoix ve domatesle hazırlanan esmer anne sos","Demi-glace'ın temelidir.","s"],["sos","Hollandaise Sos","yumurta sarısı, tereyağı ve limon suyuyla benmaride yapılan sıcak emülsiyon anne sos","Sarı yaklaşık 70°C üzerinde pıhtılaşıp sos kesilebilir.","s"],["sos","Sos Tomat","domates, aromatik sebzeler ve stokla hazırlanan temel kırmızı anne sos","Beş anne sosun domates tabanlı olanıdır.","s"],["sos","Béarnaise Sos","hollandaise sosun şalot, tarhun ve sirke redüksiyonuyla zenginleştirilmiş türevi","Izgara etlerin klasik eşlikçisidir.","s"],["sos","Mornay Sos","béchamel sosa rendelenmiş peynir eklenerek hazırlanan türev sos","Graten ve makarna fırınlarında kullanılır.","s"],["sos","Demi-glace","espagnole sos ile kahverengi stokun eşit oranda karıştırılıp yarıya inene kadar kaynatılması","Yoğun, parlak ve zengin bir et sosu verir.","s"],["sos","Roux","eşit ağırlıkta tereyağı ve unun kavrulmasıyla hazırlanan bağlayıcı","Kavrulma derecesine göre beyaz, blond ve esmer olur.","b"],["sos","Liyezon","yumurta sarısı ve kremanın sosa veya çorbaya bağlayıcı ve zenginleştirici olarak eklenmesi","Sarı kesilmesin diye önce sıcak sıvıyla tavlanır.","b"],["sos","Beurre Manié","eşit miktarda yumuşak tereyağı ve unun yoğrulup kaynayan sosa parça parça eklenmesi","Hızlı kıvam ayarı için kullanılır.","b"],["sos","Mayonez","yumurta sarısı ve sıvı yağın soğuk emülsiyonla birleştirildiği sos","Hollandaise'in aksine soğuk bir emülsiyondur.","s"],["sos","Consommé","yumurta akı, kıyma ve sebzeyle berraklaştırılmış, berrak ve yoğun et suyu çorbası","Berraklaştırma sırasında yüzeyde 'raft' denen katman oluşur.","b"],["sos","Allemande Sos","velouté sosa yumurta sarısı ve krema eklenerek hazırlanan türev sos","Liyezonla bağlanan velouté türevidir.","s"],["sos","Soubise Sos","béchamel sosa soğan püresi eklenerek hazırlanan türev sos","Yumuşak ve hafif tatlımsı bir lezzeti vardır.","s"],["sos","Mousseline Sos","hollandaise sosa çırpılmış krema katılarak hazırlanan hafif türev sos","Balık ve kuşkonmazla sunulur.","s"],["sos","Chasseur Sos","esmer sosa mantar, şalot, beyaz şarap ve domates katılarak yapılan av usulü sos","Fransızca 'avcı' anlamına gelir.","s"],["sos","Beyaz Stok","kemiklerin kavrulmadan kaynatılmasıyla elde edilen açık renkli stok","Velouté ve beyaz soslarda kullanılır.","f"],["sos","Esmer Stok","kemik ve sebzelerin önce fırında kavrulup sonra kaynatılmasıyla elde edilen koyu renkli stok","Espagnole ve demi-glace'ın temelidir.","f"],["sos","Fumet (Balık Stoku)","balık kılçık ve başlarıyla kısa sürede hazırlanan hafif stok","Uzun kaynatılırsa acılaşır.","f"],["sos","Glace","stokun çok yoğun, yapışkan kıvam alana kadar redükte edilmesiyle elde edilen konsantre","Soslara derinlik ve parlaklık verir.","f"],["sos","Vinaigrette","yağ ve asidin (sirke veya limon) geçici emülsiyonuyla yapılan soğuk sos","Salata sosu olarak kullanılır.","s"],["pisirme","Maillard Reaksiyonu","140°C üzerinde amino asitler ve şekerlerin tepkimeye girerek lezzet ve kahverengi kabuk oluşturması","Mühürlenen etin ve ekmek kabuğunun lezzetini verir.","k"],["pisirme","Karamelizasyon","yüksek ısıda şekerlerin tek başına bozunup kahverengileşmesi ve tatlı-acı lezzet kazanması","Maillard'dan farklı olarak protein gerektirmez.","k"],["pisirme","Breze (Braising)","büyük parça etlerin önce mühürlenip sonra az sıvıyla kapalı kapta ağır ateşte pişirilmesi","Bağ dokusunu jelatine çevirir; karma pişirme yöntemidir.","t"],["pisirme","Poşe","gıdanın yaklaşık 70-85°C'deki sıvıda yavaşça pişirilmesi","Kaynama noktasının altındadır; balık ve yumurtada nazik sonuç verir.","t"],["pisirme","Sote","küçük parçaların az yağda, yüksek ateşte, tavayı sallayarak kısa sürede pişirilmesi","Fransızca 'zıplatmak' anlamındaki sözcükten gelir.","t"],["pisirme","Blanching","sebzenin kısa süre kaynar suda haşlanıp hemen buzlu suya alınması","Rengi ve dokuyu korur, enzim aktivitesini durdurur.","t"],["pisirme","Sous-Vide","vakumlanmış gıdanın hassas sıcaklıktaki su banyosunda uzun süre pişirilmesi","Etin her yerinin eşit pişmesini sağlar.","t"],["pisirme","Confit","gıdanın düşük ısıda yağda yavaş pişirilip yağın içinde saklanması","Klasik örneği ördek confit'dir.","t"],["pisirme","Deglaze","tavanın dibindeki kavrulmuş kalıntıların şarap veya stokla çözülüp sosa katılması","Bu kalıntıya fond denir ve sosa yoğun lezzet verir.","k"],["pisirme","Redüksiyon","sıvının buharlaştırılarak koyulaştırılması ve lezzetinin yoğunlaştırılması","Sos yapımında en temel tekniklerden biridir.","k"],["pisirme","Mühürleme (Searing)","etin yüzeyinin yüksek ısıda kahverengileştirilerek lezzetli bir kabuk oluşturulması","Etin suyunu hapsetmez; asıl amacı lezzet ve renktir.","k"],["pisirme","Nemli Isı Pişirme","gıdaya su, stok veya buharla ısı aktaran haşlama, poşe ve buğulama gibi yöntemler","Kuru ısıdan farklı olarak kabuk oluşmaz.","t"],["pisirme","Haşlama (Boiling)","gıdanın yaklaşık 100°C'de kaynayan sıvıda pişirilmesi","Poşeden çok daha yüksek ısıdadır; makarna ve patateste kullanılır.","t"],["pisirme","Buğulama (Steaming)","gıdanın suyla temas etmeden, kaynayan suyun buharıyla pişirilmesi","Besin değerini ve rengi iyi korur.","t"],["pisirme","Derin Yağda Kızartma","gıdanın yaklaşık 160°C-190°C'deki bol yağda tamamen batırılarak pişirilmesi","Yağ ısısı düşerse gıda fazla yağ çeker.","t"],["pisirme","Roasting (Fırında Kavurma)","gıdanın fırında kuru ve sıcak havayla pişirilerek kabuk kazandırılması","Büyük et ve sebze parçalarında kullanılır.","t"],["pisirme","Flambe","yemeğin üzerine alkol eklenip yakılarak alkolün uçurulması ve aroma verilmesi","Güvenlik için dikkatle uygulanır.","k"],["pisirme","Bain-marie (Benmari)","kabın sıcak su dolu başka bir kap içine konup dolaylı ve yumuşak ısıyla ısıtılması","Çikolata eritme ve hollandaise yapımında kullanılır.","t"],["pisirme","Papillote","gıdanın yağlı kağıt veya folyoda kapalı olarak kendi buharıyla fırında pişirilmesi","Balık ve sebzede aromayı korur.","t"],["pisirme","İletim (Kondüksiyon)","ısının kaptan gıdaya doğrudan temasla geçmesi","Tavada mühürleme buna örnektir.","r"],["pisirme","Konveksiyon","ısının sıcak hava veya sıvının hareketiyle gıdaya taşınması","Fanlı fırın ve kaynayan su bu şekilde ısıtır.","r"],["pisirme","Radyasyon (Işıma)","ısının dalgalar halinde yayılarak gıdaya ulaşması","Izgara ve salamander buna örnektir.","r"],["pisirme","Mikrodalga Isıtma","elektromanyetik dalgaların su moleküllerini titreştirerek gıdayı içeriden ısıtması","Eşit ısınmaz; karıştırıp bekletmek gerekir.","r"],["et","49°C - 52°C (Rare)","ortası koyu kırmızı ve ılık olan çok az pişmiş etin merkez sıcaklığı","Ortası en çiğ pişirme derecesidir.","d"],["et","55°C - 57°C (Medium Rare)","ortası sıcak kırmızı olan, az pişmiş bonfilenin ideal merkez sıcaklığı","Yüksek sululuk ve yumuşaklık sunar.","d"],["et","60°C - 63°C (Medium)","ortası pembe olan, orta pişmiş etin merkez sıcaklığı","Sululuk korunur, kırmızılık azalır.","d"],["et","71°C ve üzeri (Well Done)","içi tamamen kahverengi-gri olan, iyi pişmiş etin merkez sıcaklığı","En kuru ve en sert pişirme derecesidir.","d"],["et","Bonfile","dana sırtının iç tarafında bulunan, en yumuşak et parçası","Az çalışan kastan geldiği için yumuşaktır.","y"],["et","Chateaubriand","dana bonfilenin kalın orta kısmından kesilen, genellikle iki kişilik büyük parça","Genelde bütün halde pişirilip masada dilimlenir.","y"],["et","Antrikot (Entrecôte)","dana kaburgalar arasındaki sırt etinden kesilen, iç yağlı biftek","Adı Fransızca 'kaburga arası' demektir.","y"],["et","Dana Carpaccio","çiğ ve çok ince dilimlenmiş dana etinin zeytinyağı, limon ve peynirle sunulması","Venedik'te Harry's Bar'da ortaya çıkmıştır.","y"],["et","Osso Buco","kemik iliğiyle birlikte enine kesilmiş dana incik etinin brezelenmesiyle yapılan Milano yemeği","Geleneksel olarak gremolata ile servis edilir.","y"],["et","Dinlendirme (Resting)","pişen etin kesilmeden önce bir süre bekletilip özsuyunun dağılmasının sağlanması","Hemen kesil function uniqOpts(correct,pool,ord){
  let set=new Set([correct]);
  for(let x of (ord?pool:shuf(pool))){if(set.size>=4)break;if(x&&x!==correct)set.add(x)}
  for(let f of ["Standart Dışı Uygulama","Hatalı Mutfak Prosedürü","Geleneksel Olmayan Yöntem","Kritik Limit İhlali"]){if(set.size>=4)break;set.add(f)}
  return shuf([...set]);
}

let M_DB=[],M_AUD=[],M_CRISIS=[],M_TF=[];
function mergeData(){
  M_DB=[];M_AUD=[];M_CRISIS=[];M_TF=[];
  const add=(a,t)=>{if(Array.isArray(a))t.push(...a)};
  if(typeof DB!=="undefined")add(DB,M_DB);
  if(typeof DB_YENI!=="undefined")add(DB_YENI,M_DB);
  if(typeof AUD!=="undefined")add(AUD,M_AUD);
  if(typeof AUD_YENI!=="undefined")add(AUD_YENI,M_AUD);
  if(typeof CRISIS!=="undefined")add(CRISIS,M_CRISIS);
  if(typeof CRISIS_YENI!=="undefined")add(CRISIS_YENI,M_CRISIS);
  if(typeof TF!=="undefined")add(TF,M_TF);
  if(typeof TF_YENI!=="undefined")add(TF_YENI,M_TF);
  if(Array.isArray(window.PAKETLER))window.PAKETLER.forEach(p=>{if(!p)return;add(p.db,M_DB);add(p.aud,M_AUD);add(p.crisis,M_CRISIS);add(p.tf,M_TF)});
  let fb=!M_DB.length;add(EMBED.db,M_DB);add(EMBED.aud,M_AUD);add(EMBED.crisis,M_CRISIS);add(EMBED.tf,M_TF);
  const dd=(a,ok)=>{let s=new Set();return a.filter(x=>{if(!Array.isArray(x)||!ok(x))return false;let k=x[0]+":"+x[1];if(s.has(k))return false;s.add(k);return true})};
  M_DB=dd(M_DB,x=>x.length>=4);
  M_AUD=dd(M_AUD,x=>x.length>=5&&Array.isArray(x[2]));
  M_CRISIS=dd(M_CRISIS,x=>x.length>=7);
  M_TF=dd(M_TF,x=>x.length>=4).map(x=>{let y=[...x];y[2]=(x[2]===true||/^(doğru|dogru|true|d)$/i.test(String(x[2]).trim()))?"DOĞRU":"YANLIŞ";return y});
  let n=M_DB.length*3+M_AUD.length+M_CRISIS.length+M_TF.length;
  $("poolBadge").textContent=fb?`YERLEŞİK HAVUZ • ${n} SORU`:`SORU BANKASI ✓ • ${n} SORU`;
}

/* ---------- MALİYET SORULARI ---------- */
function genMath(){
  let m=Math.floor(Math.random()*6),R={c:"maliyet"};
  if(m===0){
    let it=pick(["Atlantik Somonu","Dana Bonfile","Kalkan Balığı","Kuzu Sırt"]),b=pick([20,40]),f=pick([15,20,25,30]),n=b*(100-f)/100;
    return {...R,t:"MALİYET • FİRE HESABI",q:`Brüt ${b} kg ${it} temizlenince ${n} kg net porsiyonluk ürün kalıyor. Fire oranı yüzde kaçtır?`,a:`%${f}`,o:uniqOpts(`%${f}`,[`%${f+5}`,`%${f-5}`,`%${f+10}`,`%${100-f}`]),n:`Fire = (${b}-${n})/${b} = %${f}. Net verim (yield) %${100-f}'dir.`};
  }
  if(m===1){
    let [c,fc,p]=pick([[60,25,240],[75,25,300],[90,30,300],[120,30,400],[150,25,600]]);
    return {...R,t:"MALİYET • MENÜ FİYATLAMA",q:`Reçete maliyeti ${c} TL olan tabak için hedef Food Cost %${fc} ise vergisiz satış fiyatı kaç TL olmalıdır?`,a:`${p} TL`,o:uniqOpts(`${p} TL`,[`${p+50} TL`,`${p-40} TL`,`${p+100} TL`]),n:`Satış fiyatı = Maliyet / Food Cost = ${c} / 0,${fc} = ${p} TL.`};
  }
  if(m===2){
    let fl=pick([1000,2000,3000]),h=pick([60,65,70]),w=fl*h/100;
    return {...R,t:"MALİYET • FIRINCI YÜZDESİ",q:`%${h} hidratasyonlu ekşi maya ekmek reçetesinde ${fl} g un için kaç gram su gerekir?`,a:`${w} g`,o:uniqOpts(`${w} g`,[`${w+150} g`,`${w-150} g`,`${w+300} g`]),n:`Fırıncı yüzdesinde un %100'dür: ${fl} x %${h} = ${w} g su.`};
  }
  if(m===3){
    let g=pick([40,60,80,100]),net=g/5,brut=net*5/4;
    return {...R,t:"MALİYET • BANKET SİPARİŞİ",q:`${g} kişilik bankette kişi başı 200 g net bonfile sunulacaktır. Fire %20 (verim %80) ise kaç kg brüt et sipariş edilmelidir?`,a:`${brut} kg`,o:uniqOpts(`${brut} kg`,[`${brut+3} kg`,`${brut-2} kg`,`${brut+6} kg`]),n:`Net ihtiyaç ${net} kg. Brüt sipariş = ${net} / 0,80 = ${brut} kg.`};
  }
  if(m===4){
    let k=pick([5,6,8]),g=pick([120,150,200]),tot=g*k;
    return {...R,t:"MALİYET • REÇETE ÖLÇEKLENDİRME",q:`4 porsiyonluk standart reçetede ${g} g tereyağı kullanılıyorsa, ${4*k} porsiyonluk üretim için kaç gram tereyağı gerekir?`,a:`${tot} g`,o:uniqOpts(`${tot} g`,[`${tot+200} g`,`${tot-150} g`,`${tot+350} g`]),n:`Çarpan = ${4*k} / 4 = ${k}. İhtiyaç: ${g} x ${k} = ${tot} g.`};
  }
  let sell=pick([200,300,400]),pct=pick([25,30,35]),cost=sell*pct/100;
  return {...R,t:"MALİYET • FOOD COST YÜZDESİ",q:`Vergisiz satış fiyatı ${sell} TL olan bir tabağın reçete maliyeti ${cost} TL ise gerçekleşen Food Cost oranı yüzde kaçtır?`,a:`%${pct}`,o:uniqOpts(`%${pct}`,[`%${pct+5}`,`%${pct-5}`,`%${pct+10}`]),n:`Food Cost % = (${cost} / ${sell}) x 100 = %${pct}.`};
}

/* ---------- DESTE ---------- */
const BLITZ="⚡ ADİSYON BASKINI • 12 SN";
function build(cat){
  mergeData();
  if(cat==="daily"){
    let t=ymd(new Date()),h=0;for(let i=0;i<t.length;i++)h=(h*31+t.charCodeAt(i))>>>0;
    let R=Math.random;Math.random=()=>{h=(h+0x6D2B79F5)>>>0;let x=Math.imul(h^h>>>15,1|h);x=x+Math.imul(x^x>>>7,61|x)^x;return((x^x>>>14)>>>0)/4294967296};
    try{return build("all").slice(-7)}finally{Math.random=R}
  }
  if(cat==="wrong")return shuf(st.wrongs.map(w=>({...w,o:w.tf?["DOĞRU","YANLIŞ"]:shuf(w.o)})));
  let d=[];
  if(cat==="maliyet")for(let i=0;i<14;i++)d.push(genMath());
  let all=cat==="all",list=all?M_DB:M_DB.filter(x=>x[0]===cat);
  list.forEach((k,idx)=>{
    let k1=cleanTxt(k[1]),k2=cleanTxt(k[2]),k3=cleanTxt(k[3]),c=k[0],T=c.toUpperCase(),L0=d.length;
    let g=k[4],rest=M_DB.filter(x=>x[0]===c&&x[1]!==k[1]),gp=g?rest.filter(x=>x[4]===g):[];
    let same=[...shuf(gp),...shuf(rest.filter(x=>!gp.includes(x)))];
    if(same.length<3)same=[...same,...shuf(M_DB.filter(x=>x[1]!==k[1]&&!same.includes(x)))];
    d.push({c,t:T+" • TERMİNOLOJİ",q:`"${k2}" olarak tanımlanan kavram, eser veya standart hangisidir?`,a:k1,o:uniqOpts(k1,same.map(x=>cleanTxt(x[1])),1),n:k3});
    d.push({c,t:T+" • STANDART",q:`Mutfak ve servis literatüründe "${k1}" ifadesinin doğru karşılığı hangisidir?`,a:k2,o:uniqOpts(k2,same.map(x=>cleanTxt(x[2])),1),n:k3});
    if(idx%2===0)d.push({c,t:BLITZ,q:`"${k1}", ${lc(k2)} olarak tanımlanır.`,a:"DOĞRU",o:["DOĞRU","YANLIŞ"],n:`Doğru! ${k1}: ${k3}`,tf:1});
    else{
      let fake=shuf(same.slice(0,Math.max(gp.length,3))).find(x=>cleanTxt(x[2])!==k2);
      if(fake)d.push({c,t:BLITZ,q:`"${k1}", ${lc(cleanTxt(fake[2]))} olarak tanımlanır.`,a:"YANLIŞ",o:["DOĞRU","YANLIŞ"],n:`Yanlış! Bu tanım "${cleanTxt(fake[1])}" kavramına aittir. ${k1}: ${k2}.`,tf:1});
    }
    for(let j=L0;j<d.length;j++)d[j].kk=c+k1;
  });
  (all?M_AUD:M_AUD.filter(a=>a[0]===cat)).forEach(au=>{
    let ans=cleanTxt(au[3]);
    d.push({c:au[0],t:"REÇETE & KUVER DENETİMİ",q:`"${cleanTxt(au[1])}" kapsamında aşağıdakilerden hangisi kesinlikle YER ALMAZ?`,a:ans,o:uniqOpts(ans,au[2].map(cleanTxt)),n:cleanTxt(au[4])});
  });
  (all?M_CRISIS:M_CRISIS.filter(x=>x[0]===cat)).forEach(cr=>{
    let a=cleanTxt(cr[2]);
    d.push({c:cr[0],t:"ŞEFİN KARARI • KRİZ YÖNETİMİ",q:cleanTxt(cr[1]),a,o:uniqOpts(a,[cleanTxt(cr[3]),cleanTxt(cr[4]),cleanTxt(cr[5])]),n:cleanTxt(cr[6])});
  });
  (all?M_TF:M_TF.filter(x=>x[0]===cat)).forEach(tf=>{
    d.push({c:tf[0],t:BLITZ,q:cleanTxt(tf[1]),a:tf[2],o:["DOĞRU","YANLIŞ"],n:cleanTxt(tf[3]),tf:1});
  });
  if(all)for(let i=0;i<5;i++)d.push(genMath());
  let bk={},rd=[];d.forEach((q,i)=>{let k=q.kk||"u"+i;(bk[k]=bk[k]||[]).push(q)});
  Object.values(bk).forEach(v=>shuf(v).forEach((q,i)=>(rd[i]=rd[i]||[]).push(q)));
  return [].concat(...rd.map(shuf)).slice(0,all?30:40).reverse();
}

    let spd=Math.floor(st.left/3),pt=20*st.cmb+spd,old=rankIdx();

  $("fGrade").textContent="Akademik Not: "+gr;
  $("fScr").textContent=st.scr+" Puan";$("fOk").textContent=st.okCount+" / "+(st.okCount+st.lost);$("fAcc").textContent="%"+acc;

  $("wBtn").style.display=st.wrongs.length?"block":"none";
  hud();
  $("fRnk").textContent=`Güncel rütbe: ${$("rNam").textContent} (${st.xp} XP).${extra}`;
  show("overScr");
}

addEventListener("keydown",e=>{
  if(!$("gameScr").classList.contains("active"))return;
  if(e.key==="Enter"){if($("expBar").classList.contains("show")){e.preventDefault();$("nxtBtn").click()}return}
  let i="1234".indexOf(e.key);if(i<0)i="abcd".indexOf(e.key.toLowerCase());
  let b=i>=0&&document.querySelectorAll(".obtn")[i];
  if(b&&!st.lock&&!b.classList.contains("elim"))b.click();
});

/* ---------- AÇILIŞ ---------- */
(function(){
  drawMenu();mergeData();hud();
  const base=location.href.split("#")[0].split("?")[0].replace(/[^\/]*$/,"");
  const tries=["sorular.js?v="+Math.floor(Date.now()/36e5),"sorular.js","Sorular.js"];
  let i=0;
  function go(){
    if(i>=tries.length){mergeData();hud();msg("sorular.js bulunamadı; yerleşik havuz kullanılıyor.");return}
    let sc=document.createElement("script");sc.src=base+tries[i++];
    sc.onload=()=>{mergeData();hud()};
    sc.onerror=()=>{sc.remove();go()};
    document.head.appendChild(sc);
  }
  go();
})();
</script>
